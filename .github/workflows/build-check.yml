name: Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and build
        id: build
        shell: bash
        run: |
          set +e
          npm ci 2>&1 | tee build-error.log
          install_status=${PIPESTATUS[0]}
          if [ $install_status -ne 0 ]; then
            exit $install_status
          fi
          npm run build 2>&1 | tee -a build-error.log
          exit ${PIPESTATUS[0]}

      - name: Save build error to repository
        if: failure() && steps.build.outcome == 'failure'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-error.log
          git diff --cached --quiet && exit 0
          git commit -m "ci: capture build error [skip ci]"
          git push
